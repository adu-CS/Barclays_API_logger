input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  mutate {
    add_field => { "service" => "my-app" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "my-app-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "yourpassword"
  }
  stdout { codec => rubydebug }
}
